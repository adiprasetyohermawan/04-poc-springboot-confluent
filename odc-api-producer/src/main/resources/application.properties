spring.application.name=odc-api-producer
# Server port
server.port=8080

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Memory buffer Kafka producer (128MB)
spring.kafka.properties.buffer.memory=1342177280

# Allow Kafka to wait/block before failing
spring.kafka.properties.max.block.ms=1800000   # 30 minutes (in ms)

# Control delivery attempt time window
spring.kafka.properties.delivery.timeout.ms=1800000   # 30 minutes

# How long to wait for each request (per attempt)
spring.kafka.properties.request.timeout.ms=60000      # 60 seconds

# Retry config
spring.kafka.properties.retries=100
spring.kafka.properties.retry.backoff.ms=1000